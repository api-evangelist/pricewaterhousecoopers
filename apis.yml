aid: pricewaterhousecoopers
name: PwC (PricewaterhouseCoopers)
description: >-
  PricewaterhouseCoopers (PwC) is one of the Big Four professional services
  firms, with approximately 370,000 staff across a global network of member
  firms coordinated by PricewaterhouseCoopers International Limited (PwCIL).
  PwC organizes delivery across three primary service lines — Assurance
  (audit), Tax (tax compliance, planning, and reporting), and Advisory
  (consulting, deals, and risk). The firm operates proprietary technology
  platforms including PwC Halo (a suite of data analytics tools used to
  support audit engagements), the Trusted AI initiative (PwC's responsible-AI
  governance and assurance framework), and ProEdge (a workforce upskilling
  platform). In April 2024 PwC announced a multi-year alliance with OpenAI
  positioning the firm as both OpenAI's largest customer and its first
  reseller of ChatGPT Enterprise, supporting PwC's broader generative-AI
  consulting practice. PwC's research and insights surface — pwc.com/insights,
  the annual Global CEO Survey, the Global Workforce Hopes and Fears Survey,
  the Money Tree report, and regional industry outlooks — is the firm's
  primary public-facing knowledge product. PwC does not publish a public
  developer portal, OpenAPI specifications, partner API documentation, or a
  GitHub organization at the corporate level. The github.com/pwc handle is
  held by an unrelated individual user (Patrick Clearwater). Any technical
  integrations with PwC platforms are arranged through engagement contracts
  and the PwC Technology Consulting practice rather than through self-service
  developer credentials. PwC's content distribution is reader-facing
  (newsletter subscriptions, the PwC US Newsroom, LinkedIn, YouTube) with no
  documented public RSS feed endpoint exposing news, press releases, or
  insights as a syndication contract.
